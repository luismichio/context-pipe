[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-context-pipe"
version = "0.2.4"
description = "Universal switchboard for the Context-Pipe Protocol (CPP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Luis Kobayashi" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.0",
  "psutil>=5.9"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-anyio",
  "ruff",
  "mypy"
]

[project.scripts]
context-pipe = "context_pipe.orchestrator:main"
context-pipe-server = "context_pipe.server:main"
context-pipe-script = "context_pipe.scripts:main"
mcp-pipe = "context_pipe.cli:main"

[tool.setuptools]
packages = ["context_pipe"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["context_pipe", "pipe_hook"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Ratchet: Phase 2 baseline = 25%. Target: 40% (Phase 3), 60% (Phase 4+), 82% (Phase 7.5), 83% (Phase 7.6).
# Do NOT lower this value. Raise it when new tests are added.
fail_under = 83
