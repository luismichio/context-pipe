[package]
name = "cpipe"
version = "0.4.4"
edition = "2021"
description = "Context-Pipe high-performance Rust orchestrator and library"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/luismichio/context-pipe"
homepage = "https://github.com/luismichio/context-pipe"
keywords = ["mcp", "context-pipe", "llm", "orchestrator", "ai"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "cpipe"
path = "src/lib.rs"

[[bin]]
name = "cpipe"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "macros", "io-util", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
regex = "1.10"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
shlex = "1.3"
lazy_static = "1.4"
