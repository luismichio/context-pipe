name: Release Binaries
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: macos-14
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build cpipe
        run: |
          cargo build --release --target ${{ matrix.target }}
        working-directory: crates/cpipe
      - name: Package Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp ../../target/${{ matrix.target }}/release/cpipe${{ matrix.suffix }} artifacts/cpipe-${{ matrix.target }}${{ matrix.suffix }}
          cd artifacts
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a cpipe-${{ matrix.target }}.zip cpipe-${{ matrix.target }}${{ matrix.suffix }}
          else
            tar -czf cpipe-${{ matrix.target }}.tar.gz cpipe-${{ matrix.target }}${{ matrix.suffix }}
          fi
        working-directory: crates/cpipe
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpipe-${{ matrix.target }}
          path: crates/cpipe/artifacts/cpipe-${{ matrix.target }}.*
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
